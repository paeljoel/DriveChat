<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#7360f2">
<title>DriveChat</title>
<meta name="description" content="Private, end-to-end encrypted messaging and calls. Your chats live in your own Google Drive.">
<meta property="og:type" content="website">
<meta property="og:title" content="DriveChat: private chat in your own Google Drive">
<meta property="og:description" content="End-to-end encrypted messages, photos, voice notes and calls. No company servers in between.">
<meta property="og:image" content="https://drivechat-7nzd.onrender.com/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="DriveChat">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DriveChat">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --accent:#7360f2;--accent-2:#5b48e0;--accent-soft:#ece9ff;
  --bg:#ffffff;--bg-2:#f4f4f8;--bg-3:#ebebf1;--line:#e3e3ea;
  --text:#16161d;--text-2:#5d5d6c;--text-3:#9494a3;
  --me:#7360f2;--me-text:#fff;--them:#f0f0f5;--them-text:#16161d;
  --danger:#e5484d;--ok:#22a06b;--shadow:0 8px 30px rgba(20,20,40,.14);
  --radius:18px;--sidebar:340px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#17171c;--bg-2:#1f1f26;--bg-3:#2a2a33;--line:#2e2e38;
  --text:#ececf1;--text-2:#a9a9b8;--text-3:#70707f;
  --them:#2a2a33;--them-text:#ececf1;--accent-soft:#2c2650;--shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--accent)}
.hidden{display:none!important}
.icon{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s}
.ibtn:hover{background:var(--bg-3);color:var(--text)}
.ibtn.accent{color:var(--accent)}
.btn{padding:10px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;transition:background .15s,opacity .15s}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--bg-3);color:var(--text)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger)}
.btn.block{width:100%}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);outline:none}
.field:focus{border-color:var(--accent)}
label.lbl{display:block;font-size:13px;color:var(--text-2);margin:14px 0 6px;font-weight:600}
.muted{color:var(--text-2)}.small{font-size:13px}.tiny{font-size:12px}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#7360f2 0%,#9a6cf5 50%,#c56ff0 100%);overflow:auto}
.card{background:var(--bg);border-radius:24px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:460px;max-height:calc(100vh - 40px);overflow:auto}
.card h1{margin:0 0 6px;font-size:26px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.logo svg{width:32px;height:32px}
.steps{font-size:13.5px;color:var(--text-2);padding-left:20px;line-height:1.6}
.steps code{background:var(--bg-3);padding:1px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
.ws-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg-2);margin-bottom:8px;width:100%;text-align:left}
.ws-item:hover{background:var(--bg-3)}
.divider{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:12px;margin:18px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.row-inline{display:flex;gap:8px}
/* ---------- main layout ---------- */
.main{position:fixed;inset:0;display:flex}
.sidebar{width:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg);min-width:0}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.sb-title{flex:1;min-width:0}
.sb-title b{display:block;font-size:20px}
.sb-title span{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin:4px 14px 8px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:20px;border:0;background:var(--bg-2);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3)}
.tabs{display:flex;gap:6px;padding:0 14px 8px}
.tab{padding:6px 14px;border-radius:16px;font-size:14px;font-weight:600;color:var(--text-2)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:0 8px 12px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer;width:100%;text-align:left}
.item:hover{background:var(--bg-2)}
.item.on{background:var(--accent-soft)}
.item .meta{flex:1;min-width:0}
.item .top{display:flex;align-items:baseline;gap:8px}
.item .name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .time{font-size:12px;color:var(--text-3);flex-shrink:0}
.item .bottom{display:flex;align-items:center;gap:8px;margin-top:2px}
.item .preview{flex:1;font-size:13.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.unread .preview{color:var(--text);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge.muted-b{background:var(--text-3)}
.empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:14px}
/* avatar */
.av{position:relative;flex-shrink:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:visible;user-select:none}
.av>img,.av>.ini{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center}
.av .dot{position:absolute;right:0;bottom:0;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.av.grp .ini{font-size:.9em}
/* chat */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:64px}
.chat-head .who{flex:1;min-width:0;cursor:pointer}
.chat-head .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who span{font-size:12.5px;color:var(--text-3)}
.chat-head .who span.typing{color:var(--accent)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column}
.load-more{align-self:center;margin:6px 0 14px;font-size:13px;color:var(--text-3)}
.day{align-self:center;font-size:12px;color:var(--text-3);background:var(--bg-2);padding:4px 12px;border-radius:12px;margin:14px 0 10px}
.sys{align-self:center;font-size:12.5px;color:var(--text-3);margin:6px 0;text-align:center;max-width:80%}
.mrow{-webkit-touch-callout:none;display:flex;align-items:flex-end;gap:8px;margin-top:2px;position:relative;max-width:100%}
.mrow.first{margin-top:10px}
.mrow.me{flex-direction:row-reverse}
.mrow .avs{width:30px;flex-shrink:0}
.mwrap{display:flex;flex-direction:column;max-width:min(560px,72%);min-width:0}
.mrow.me .mwrap{align-items:flex-end}
.sender{font-size:12px;color:var(--text-3);margin:0 0 3px 12px;font-weight:600}
.bubble{padding:8px 12px;border-radius:var(--radius);background:var(--them);color:var(--them-text);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.38;font-size:15px;position:relative}
.mrow.me .bubble{background:var(--me);color:var(--me-text)}
.mrow.them:not(.last) .bubble{border-bottom-left-radius:6px}
.mrow.them:not(.first) .bubble{border-top-left-radius:6px}
.mrow.me:not(.last) .bubble{border-bottom-right-radius:6px}
.mrow.me:not(.first) .bubble{border-top-right-radius:6px}
.bubble.big{background:none!important;font-size:42px;padding:0 2px;line-height:1.15}
.bubble.deleted{font-style:italic;opacity:.65}
.bubble.media{padding:4px;overflow:hidden}
.bubble a{color:inherit;text-decoration:underline}
.mrow.me .bubble.pending{opacity:.6}
.mrow.me .bubble.failed{background:var(--danger)}
.mtime{font-size:11px;opacity:.7;margin-left:8px;float:right;margin-top:6px;white-space:nowrap}
.bubble.media .mtime{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;padding:1px 7px;border-radius:9px;opacity:1}
.quote{border-left:3px solid currentColor;padding:2px 8px;margin:2px 0 6px;font-size:13px;opacity:.8;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;max-width:320px}
.quote b{display:block;font-size:12px}
.att-img{display:block;max-width:300px;max-height:320px;min-width:120px;min-height:80px;border-radius:14px;cursor:zoom-in;object-fit:cover;background:var(--bg-3)}
.att-file{display:flex;align-items:center;gap:10px;padding:6px 4px;min-width:200px;cursor:pointer}
.att-file .fi{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mrow.them .att-file .fi{background:var(--bg-3)}
.att-file .fn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.att-audio{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0}
.att-audio .play{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mrow.them .att-audio .play{background:var(--accent);color:#fff}
.att-audio .bar{flex:1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);position:relative;cursor:pointer}
.att-audio .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:currentColor;width:0}
.att-audio .dur{font-size:12px;opacity:.8;min-width:34px}
.att-video{display:block;max-width:320px;max-height:320px;border-radius:14px;background:#000}
.reacts{display:flex;gap:4px;margin-top:-6px;z-index:1;flex-wrap:wrap}
.mrow.me .reacts{justify-content:flex-end}
.react{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:13px;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.react.mine{border-color:var(--accent);background:var(--accent-soft)}
.mact{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s;align-self:center}
.mrow:hover .mact,.mrow.touch .mact{opacity:1}
.mact .ibtn{width:30px;height:30px}.mact .icon{width:18px;height:18px}
.seen{font-size:11.5px;color:var(--text-3);align-self:flex-end;margin:3px 4px 0}
.typing-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.dots{background:var(--them);border-radius:var(--radius);padding:12px 14px;display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--text-3);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.flash .bubble{animation:flash 1.2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:none}}
/* composer */
.bar-top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);background:var(--bg-2);font-size:13px}
.bar-top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-top b{color:var(--accent)}
.composer{display:flex;align-items:flex-end;gap:4px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.composer .inp{flex:1;background:var(--bg-2);border-radius:22px;display:flex;align-items:flex-end;padding:0 6px 0 16px;min-height:42px}
.composer textarea{flex:1;border:0;outline:none;background:none;resize:none;padding:11px 0;max-height:160px;line-height:1.35;font-size:15px}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.send:hover{background:var(--accent-2)}
.rec{display:flex;align-items:center;gap:12px;flex:1;padding:0 12px;height:42px}
.rec .rdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
.uploads{padding:0 16px}
.up{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.up .pb{flex:1;height:4px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.up .pb i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);text-align:center;padding:30px}
.welcome .logo{width:80px;height:80px;border-radius:24px}
.welcome .logo svg{width:44px;height:44px}
.drop{position:absolute;inset:0;background:rgba(115,96,242,.12);border:3px dashed var(--accent);border-radius:16px;margin:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:18px;pointer-events:none;z-index:5}
/* info panel */
.info{width:320px;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;background:var(--bg)}
.info-hero{display:flex;flex-direction:column;align-items:center;padding:28px 20px 16px;text-align:center;gap:8px}
.info-hero b{font-size:18px}
.sect{padding:10px 16px;border-top:1px solid var(--line)}
.sect h4{margin:6px 0 8px;font-size:13px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.mline{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px}
.mline .n{flex:1;min-width:0;font-size:14px}
.mline .n small{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:10px;width:100%;text-align:left;font-size:14.5px}
.act:hover{background:var(--bg-2)}
.act.red{color:var(--danger)}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.media-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--bg-3)}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:440px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal-h{display:flex;align-items:center;padding:16px 16px 8px 22px}
.modal-h h3{flex:1;margin:0;font-size:18px}
.modal-b{padding:4px 22px 16px;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 22px 18px}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;cursor:pointer;width:100%;text-align:left}
.pick:hover{background:var(--bg-2)}
.pick .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-left:auto;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick.sel .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:14px;font-size:13px;font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--text)}
.seg{display:flex;background:var(--bg-2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px;border-radius:10px;font-size:14px;color:var(--text-2)}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.popover{position:fixed;z-index:60;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:180px;border:1px solid var(--line);animation:pop .12s}
.popover .pi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;width:100%;text-align:left;font-size:14.5px}
.popover .pi:hover{background:var(--bg-2)}
.popover .pi.red{color:var(--danger)}
.qr{display:flex;gap:2px;padding:4px}
.qr button{font-size:24px;width:40px;height:40px;border-radius:50%;transition:transform .1s}
.qr button:hover{transform:scale(1.2);background:var(--bg-2)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:240px;overflow-y:auto;width:320px;padding:4px}
.emoji-grid button{font-size:22px;height:38px;border-radius:8px}
.emoji-grid button:hover{background:var(--bg-2)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;flex-direction:column}
.lightbox img{max-width:94vw;max-height:84vh;object-fit:contain}
.lightbox .lb-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;padding:12px;gap:8px}
.lightbox .ibtn{color:#fff}.lightbox .ibtn:hover{background:rgba(255,255,255,.15)}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#222230;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:pop .2s;max-width:90vw}
.toast.err{background:var(--danger)}
.banner{position:fixed;top:0;left:0;right:0;z-index:80;background:#ffb020;color:#222;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px;font-size:14px;font-weight:600}
.banner button{background:#222;color:#fff;padding:5px 12px;border-radius:8px}
.spinner{width:28px;height:28px;border:3px solid var(--bg-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg);z-index:40;color:var(--text-2)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
/* responsive */
@media (max-width:1100px){.info{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}}
@media (max-width:760px){
  :root{--sidebar:100vw}
  .sidebar{position:absolute;inset:0;z-index:2;border-right:0}
  .main.in-chat .sidebar{display:none}
  .main:not(.in-chat) .chat{display:none}
  .back{display:inline-flex}
  .info{position:fixed;inset:0;width:100%;z-index:30}
  .mwrap{max-width:82%}
  .mact{display:none}
  .mrow.touch .mact{display:flex}
}

/* ---------- v2 additions ---------- */

  async derive(priv, pubJwk, salt, info) {

  importRaw: s => crypto.subtle.importKey('raw', unb64(s), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']),
  async sealBytes(key, data) {

/* ============================ AUTH ============================ */
const cfg = () => ({ clientId: CONFIG.clientId || LS.get('clientId', ''), apiKey: CONFIG.apiKey || LS.get('apiKey', '') });
let tokenClient = null, accessToken = null, tokenExp = 0, tokenPending = null, reconnectP = null;
function gisReady() {
  return new Promise((res, rej) => { const t0 = Date.now(); (function chk() { if (window.google?.accounts?.oauth2) return res(); if (Date.now() - t0 > 15000) return rej(new Error('Could not load Google sign-in. Check your connection or ad-blocker.')); setTimeout(chk, 100); })(); });
}
async function initAuth() {
  await gisReady();

    client_id: cfg().clientId, scope: SCOPES,
    callback: r => {
      const p = tokenPending; tokenPending = null;
      if (r.error) return p?.rej(new Error(r.error_description || r.error));
      if (!google.accounts.oauth2.hasGrantedAllScopes(r, SCOPES)) return p?.rej(new Error('Please tick the Google Drive box — DriveChat only touches files it creates itself.'));

      try { localStorage.setItem('dc_tok', JSON.stringify({ t: accessToken, e: tokenExp })); } catch {}

    },
    error_callback: e => {

function requestToken(prompt = '') {

  tokenPending = { res, rej, promise };

async function ensureToken() {

function needReconnect() {

/* ============================ DRIVE API ============================ */
async function isRateErr(r) { try { const j = await r.json(); return /rate|quota|limit/i.test(JSON.stringify(j.error || '')); } catch { return false; } }
async function httpErr(r) { let m = r.status + ' ' + r.statusText; try { const j = await r.json(); m = j.error?.message || m; } catch {} const e = new Error(m); e.status = r.status; return e; }
/* authenticated (my own files) */
async function api(path, opt = {}) {
  const { method = 'GET', query = {}, body, raw = false, headers = {} } = opt;
  for (let attempt = 0; ; attempt++) {
    const tok = await ensureToken();
    const url = new URL(path.startsWith('http') ? path : API + path);
    for (const [k, v] of Object.entries(query)) if (v !== undefined && v !== null) url.searchParams.set(k, v);
    const init = { method, headers: { Authorization: 'Bearer ' + tok, ...headers } };
    if (body !== undefined) {
      if (body instanceof Blob || body instanceof FormData || typeof body === 'string' || body instanceof Uint8Array) init.body = body;
      else { init.body = JSON.stringify(body); init.headers['Content-Type'] = 'application/json'; }
    }
    let r;
    try { r = await fetch(url, init); } catch { if (attempt < 3) { await sleep(800 * 2 ** attempt); continue; } throw new Error('Network error — are you offline?'); }
    if (r.status === 401 && attempt < 2) { accessToken = null; continue; }
    if ((r.status === 429 || r.status >= 500 || (r.status === 403 && await isRateErr(r.clone()))) && attempt < 5) { await sleep(Math.min(16000, 700 * 2 ** attempt) + Math.random() * 500); continue; }
    if (!r.ok) throw await httpErr(r);
    if (raw) return r;
    if (r.status === 204) return null;
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  }
}
/* public read with API key (friends' encrypted outboxes) */
async function pub(path, query = {}, raw = false) {
  for (let attempt = 0; ; attempt++) {
    const url = new URL(API + path); url.searchParams.set('key', cfg().apiKey);
    for (const [k, v] of Object.entries(query)) if (v !== undefined && v !== null) url.searchParams.set(k, v);
    let r;
    try { r = await fetch(url); } catch { if (attempt < 2) { await sleep(1000 * 2 ** attempt); continue; } throw new Error('Network error'); }
    if ((r.status === 429 || r.status >= 500 || (r.status === 403 && await isRateErr(r.clone()))) && attempt < 4) { await sleep(Math.min(16000, 900 * 2 ** attempt) + Math.random() * 500); continue; }
    if (!r.ok) throw await httpErr(r);
    return raw ? r : r.json();
  }
}
const mine = o => o === S.outbox;
function listIn(outbox, q, { orderBy, pageSize = 200, pageToken } = {}) {
  const query = { q, fields: `nextPageToken,files(${REC_FIELDS})`, orderBy, pageSize, pageToken, spaces: 'drive' };
  return mine(outbox) ? api('/files', { query }) : pub('/files', query);
}

/* upload blob with progress (resumable → multipart fallback) */
async function uploadBlob(blob, meta, onProgress, fields = REC_FIELDS) {
  const tok = await ensureToken(); let location = null;
  const type = meta.mimeType || 'application/octet-stream';
  try {
    const r = await fetch(`${UPLOAD}?uploadType=resumable&fields=${encodeURIComponent(fields)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': type, 'X-Upload-Content-Length': String(blob.size) }, body: JSON.stringify(meta) });
    if (r.ok) location = r.headers.get('Location');
  } catch {}
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    if (location) { xhr.open('PUT', location); xhr.setRequestHeader('Content-Type', type); xhr.send(blob); }
    else {
      const fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      fd.append('file', blob);
      xhr.open('POST', `${UPLOAD}?uploadType=multipart&fields=${encodeURIComponent(fields)}`);
      xhr.setRequestHeader('Authorization', 'Bearer ' + tok); xhr.send(fd);
    }
    xhr.upload.onprogress = e => e.lengthComputable && onProgress?.(e.loaded / e.total);

  });
}

let stateTimer = null, stateSaving = false, stateDirty = false;

}
async function loadKeys() {
  const d = parseJ(S.files.idDesc, null);

  if (d && stored && stored.pub.x === d.pub.x && stored.pub.y === d.pub.y && stored.outbox === S.outbox) { S.priv = stored.priv; S.pubJwk = d.pub; return 'ok'; }

}
async function storeKeys(privJwk, pubJwk) {

}
async function createIdentity(pass) {

}

    } catch (e) { console.warn('state unreadable (keys reset?)', e); S.st = { contacts: {}, groups: {}, pending: [], left: [] }; }

}

/* ============================ CONVERSATIONS / KEYS ============================ */
async function dmId(o) { return 'd' + (await Crypto.sha([S.outbox, o].sort().join('|'))).slice(0, 24); }
function ensureConvo(id, base) {
  let c = S.convos.get(id);
  if (!c) { c = { id, msgs: new Map(), reacts: new Map(), tokens: {}, hasMore: true, loaded: false, loading: false, created: base.created || '', ...base }; S.convos.set(id, c); }
  else Object.assign(c, base);
  return c;
}
async function buildConvos() {
  for (const [o, ct] of Object.entries(S.st.contacts)) {
    upsertPerson(o, ct);
    if (!ct.cid) ct.cid = await dmId(o);
    ensureConvo(ct.cid, { kind: 'dm', peer: o, created: ct.added ? iso(ct.added) : '' });
  }
  for (const [gid, g] of Object.entries(S.st.groups)) {
    for (const m of g.m) if (m.o !== S.outbox) upsertPerson(m.o, m, true);
    ensureConvo(gid, { kind: 'group', name: g.n, members: g.m.map(m => m.o), by: g.by, created: g.created ? iso(g.created) : '' });
  }
}
function upsertPerson(o, d, weak = false) {
  const p = S.people.get(o);
  if (p && weak && !p.ghost) return p;
  const np = { o, n: d.n || p?.n || (d.e || 'Unknown').split('@')[0], e: d.e || p?.e || '', p: d.p ?? p?.p ?? '', c: d.c || p?.c || hashColor(o), st: d.st ?? p?.st ?? '', pub: d.pub || p?.pub || null, mt: p?.mt || 0, rd: p?.rd || {}, ty: p?.ty || null, tyAt: p?.tyAt || 0 };
  S.people.set(o, np); return np;
}
async function convoKey(c) {
  const ck = c.kind === 'dm' ? 'dm:' + c.peer + ':' + JSON.stringify(personOf(c.peer).pub) : 'g:' + c.id + ':' + S.st.groups[c.id]?.key;
  if (S.keyCache.has(ck)) return S.keyCache.get(ck);
  let k;
  if (c.kind === 'dm') { const pb = personOf(c.peer).pub; if (!pb) throw new Error('no key for contact'); k = Crypto.derive(S.priv, pb, [S.outbox, c.peer].sort().join('|'), 'dc-dm'); }

  S.keyCache.set(ck, k); k.catch(() => S.keyCache.delete(ck));
  return k;
}

/* ============================ RECORDS (encrypted messages in my outbox) ============================ */
async function writeRecord(c, payload, fileId) {
  const sealed = await Crypto.seal(await convoKey(c), payload);
  if (sealed.length <= INLINE_MAX) {
    return fileId ? patchMeta(fileId, { description: sealed }) : createMeta({ name: c.id, parents: [S.outbox], mimeType: 'text/plain', description: sealed });
  }
  const blob = new Blob([sealed], { type: 'text/plain' });
  if (fileId) { await putContent(fileId, blob); return patchMeta(fileId, { description: '@b' }); }
  return uploadBlob(blob, { name: c.id, parents: [S.outbox], mimeType: 'text/plain', description: '@b' });
}
async function readSealed(f, o) { return f.description === '@b' ? tdec.decode(await fetchBytes(f.id, o)) : f.description; }

async function processFile(f, o, live, known) {
  if (!f || S.seen.get(f.id) === f.modifiedTime) return;
  const isNew = !S.seen.has(f.id);
  S.seen.set(f.id, f.modifiedTime);
  try {
    if (f.name === 'profile') return ingestProfile(o, f);
    if (f.name === 'status') return await ingestStatus(o, f);
    const c = S.convos.get(f.name);
    if (!c) { S.seen.delete(f.id); return; }
    if (!convoMembers(c).includes(o) && !(c.kind === 'group')) return;
    if (f.trashed) { c.msgs.delete(f.id); scheduleRender(); return; }
    let p = known;
    if (!p) { try { p = await Crypto.open(await convoKey(c), await readSealed(f, o)); } catch (e) { p = { k: 'm', bad: 1 }; } }
    ingestRecord(c, o, f, p, live && isNew);
  } catch (e) { console.warn('process', f.name, e); S.seen.delete(f.id); }
}
function ingestRecord(c, from, f, p, live) {
  const base = { id: f.id, cid: c.id, from, ct: f.createdTime, mt: f.modifiedTime };
  switch (p.k) {
    case 'm': {
      if (p.cl) for (const [k, v] of c.msgs) if (v.tmp && v.cl === p.cl) c.msgs.delete(k);
      const m = { ...base, t: p.t || '', rp: p.rp || null, a: p.a || null, ed: !!p.ed, del: !!p.del, bad: !!p.bad, cl: p.cl };
      c.msgs.set(f.id, m);
      if (live && from !== S.outbox && !m.del) notifyMsg(c, m);
      break;
    }
    case 'r': {
      if (!c.reacts.has(p.to)) c.reacts.set(p.to, new Map());
      c.reacts.get(p.to).set(f.id, { id: f.id, from, em: p.em, del: !!p.del });
      break;
    }
    case 'hello': c.msgs.set(f.id, { ...base, sys: 'connected · messages are end-to-end encrypted', icon: 'lock' }); markConnected(c, from); break;
    case 'log': c.msgs.set(f.id, { ...base, log: { video: !!p.video, dur: p.dur || 0, missed: !!p.missed, by: from } }); if (live && p.missed && from !== S.outbox) notifyMsg(c, { from, t: 'Missed call', ct: f.createdTime }); break;
    case 'call': c.msgs.set(f.id, { ...base, hidden: true }); if (live) onCallSignal(c, from, p, f); break;
    case 'ginv': c.msgs.set(f.id, { ...base, hidden: true }); onGroupInvite(from, p, f); break;
    case 'gupd': c.msgs.set(f.id, { ...base, sys: p.sys || 'updated the group' }); onGroupUpdate(c, from, p, f); break;
    case 'gleave': c.msgs.set(f.id, { ...base, sys: 'left the group' }); onGroupLeave(c, from, f); break;
    default: c.msgs.set(f.id, { ...base, hidden: true });
  }
  scheduleRender();
}
function markConnected(c, from) {
  if (c.kind !== 'dm' || from !== c.peer) return;
  const ct = S.st.contacts[c.peer]; if (ct && !ct.connected) { ct.connected = true; saveState(); }
}
function ingestProfile(o, f) {
  const d = parseJ(f.description, null); if (!d || !d.pub) return;
  const prev = S.people.get(o);
  const keyChanged = prev?.pub && (prev.pub.x !== d.pub.x || prev.pub.y !== d.pub.y);
  upsertPerson(o, d);
  if (o !== S.outbox) {
    const ct = S.st.contacts[o];
    if (ct) { const changed = ct.n !== d.n || ct.p !== d.p || ct.st !== d.st || ct.c !== d.c || keyChanged; Object.assign(ct, { n: d.n, e: d.e, p: d.p, c: d.c, st: d.st, pub: d.pub }); if (changed) saveState(); }
    for (const g of Object.values(S.st.groups)) for (const m of g.m) if (m.o === o && (m.n !== d.n || keyChanged)) { Object.assign(m, { n: d.n, p: d.p, e: d.e, pub: d.pub }); saveState(); }
    if (keyChanged) { S.keyCache.clear(); const c = [...S.convos.values()].find(x => x.kind === 'dm' && x.peer === o); if (c) c.msgs.set('kc' + Date.now(), { id: 'kc' + Date.now(), cid: c.id, from: o, ct: iso(Date.now()), sys: 'reinstalled DriveChat — their security code changed', icon: 'shield', local: true }); }
  }

}
async function ingestStatus(o, f) {

  p.mt = Date.parse(f.modifiedTime);
  for (const [cid, sealed] of Object.entries(d.s || {})) {
    const c = S.convos.get(cid); if (!c) continue;
    try {
      const v = await Crypto.open(await convoKey(c), sealed);

      if (v.ty && (!p.ty || p.ty.t !== v.ty) && Math.abs(v.ty - p.mt) < 15000) { p.ty = { c: cid, t: v.ty }; p.tyAt = Date.now(); }

let statusTimer = null, statusSaving = false, statusDirty = false;
function saveStatus(now = false) {

  clearTimeout(statusTimer);

  (async () => {
    try {
      const s = {};
      const ids = Object.keys(S.myRd).sort((a, b) => (S.myRd[b] > S.myRd[a] ? 1 : -1)).slice(0, 60);

      const me = myPerson(); if (me) me.mt = Date.now();
    } catch (e) { console.warn('status', e); }

  })();
}

/* ============================ POLLING ============================ */
function pollTargets() {
  const t = new Map();
  const add = (o, n) => { if (!o) return; if (!t.has(o)) t.set(o, new Set(['profile', 'status'])); if (n) t.get(o).add(n); };
  add(S.outbox);
  for (const c of S.convos.values()) for (const o of convoMembers(c)) add(o, c.id);
  return t;
}
function pollInterval(o) {
  let ms;
  if (call && call.peer === o) ms = 1000;
  else if (o === S.outbox) ms = 10000;
  else { const c = S.convos.get(S.active); ms = c && convoMembers(c).includes(o) ? 2000 : (S.st.contacts[o] ? 5000 : 8000); }
  if (document.hidden && !(call && call.peer === o)) ms = Math.max(ms * 4, 20000);
  return ms + (S.backoff.get(o) || 0);
}
async function initPeer(o) {
  if (S.peerInit.has(o)) return; S.peerInit.add(o);
  try {
    const r = await listIn(o, `'${qv(o)}' in parents and trashed=false and (name='profile' or name='status')`, { pageSize: 10 });
    const files = (r.files || []).sort((a, b) => (a.name === 'profile' ? 0 : 1) - (b.name === 'profile' ? 0 : 1));
    for (const f of files) await processFile(f, o, false);
  } catch (e) { S.peerInit.delete(o); throw e; }
}
async function pollPeer(o, names, gen) {
  if (!S.peerInit.has(o)) await initPeer(o);
  const since = S.since.get(o) ?? (S.startedAt - 120000);
  const nameQ = [...names].map(n => `name='${qv(n)}'`).join(' or ');
  let pageToken, maxT = since;
  do {
    const r = await listIn(o, `'${qv(o)}' in parents and trashed=false and modifiedTime > '${iso(since - 30000)}' and (${nameQ})`, { orderBy: 'modifiedTime', pageToken });
    if (gen !== S.gen) return;
    for (const f of r.files || []) { await processFile(f, o, true); const t = Date.parse(f.modifiedTime); if (t > maxT) maxT = t; }
    pageToken = r.nextPageToken;
  } while (pageToken);
  S.since.set(o, maxT);
}
async function pollLoop(gen) {
  let errCount = 0;
  while (S.running && gen === S.gen) {
    const targets = pollTargets(); const now = Date.now();
    const due = [...targets.keys()].filter(o => !S.inflight.has(o) && (S.nextPoll.get(o) || 0) <= now).sort((a, b) => (S.nextPoll.get(a) || 0) - (S.nextPoll.get(b) || 0)).slice(0, Math.max(0, 4 - S.inflight.size));
    for (const o of due) {
      S.inflight.add(o);
      pollPeer(o, targets.get(o), gen).then(() => { S.backoff.delete(o); if (errCount) { errCount = 0; hideBanner(); } })
        .catch(e => {
          console.warn('poll', o, e.message);
          if (e.status === 404 || e.status === 403) S.backoff.set(o, Math.min(120000, (S.backoff.get(o) || 5000) * 2));
          else if (++errCount === 3 && !reconnectP) showBanner('Connection problem — retrying…', 'Retry now', () => { S.nextPoll.clear(); });
        })
        .finally(() => { S.inflight.delete(o); S.nextPoll.set(o, Date.now() + pollInterval(o)); });
    }
    await new Promise(r => { pollLoop.wake = r; setTimeout(r, 400); });
  }
}
function wakePeer(o) { S.nextPoll.set(o, 0); pollLoop.wake?.(); }
const relayBase = () => CONFIG.pushRelay.replace(/\/$/, '');
async function checkHandshakes() {
  const pend = (S.st.pending || []).filter(p => p.keep || Date.now() - p.t < 14 * 86400000);
  if (pend.length !== (S.st.pending || []).length) { S.st.pending = pend; saveState(); }
  const found = new Set();
  const info = await relayInfo();
  if (info?.hs) {
    const ids = [...new Set([S.outbox, ...[...pend].sort((a, b) => b.t - a.t).map(p => p.r)])];   // my own ID + every invite code, newest first
    for (let i = 0; i < ids.length && i < 100; i += 10) {
      try { const r = await fetch(relayBase() + '/hs?r=' + ids.slice(i, i + 10).join(','), { cache: 'no-store' }); if (r.ok) ((await r.json()).o || []).forEach(o => found.add(o)); } catch {}
    }
  }
  for (const p of pend) {
    if (p.driveDone) continue;
    try { const f = await pub('/files/' + p.r, { fields: 'id,description' }); const d = parseJ(f.description); if (d.o) found.add(d.o); p.driveDone = true; saveState(); } catch {}
  }
  for (const o of found) {
    if (o === S.outbox || S.st.contacts[o] || (S.st.removed || []).includes(o)) continue;
    const prof = await fetchProfile(o).catch(() => null);
    if (prof) { await addContact(o, prof); toast(`${prof.n} accepted your invite 🎉 Say hi!`, false, 5000); ping(); }
  }
}
const knocked = new Map();
async function knock(o, force = false) {
  const info = await relayInfo(); if (!info?.hs) return false;
  if (!force && Date.now() - (knocked.get(o) || 0) < 10 * 60000) return true;
  try {
    const r = await fetch(relayBase() + '/hs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ r: o, o: S.outbox }) });
    if (r.ok) { knocked.set(o, Date.now()); return true; }
  } catch {}
  return false;
}
async function knockWaiting() {
  for (const [o, ct] of Object.entries(S.st.contacts)) if (!ct.connected) await knock(o);
}
async function pendingLoop(gen) {
  while (S.running && gen === S.gen) {
    await checkHandshakes().catch(e => console.warn('handshake', e.message));
    await knockWaiting().catch(e => console.warn('knock', e.message));
    const recent = Date.now() - (S.lastShare || 0) < 15 * 60000;
    await new Promise(r => { pendingLoop.wake = r; setTimeout(r, document.hidden ? 300000 : recent ? 6000 : 45000); });
  }
}
async function heartbeatLoop(gen) { while (S.running && gen === S.gen) { await sleep(HEARTBEAT_MS); if (S.running && gen === S.gen && !document.hidden) saveStatus(true); } }

async function loadHistory(c) {
  if (c.loading || (c.loaded && !c.hasMore)) return;
  c.loading = true; scheduleRender();
  try {
    const members = convoMembers(c);
    await Promise.all(members.map(async o => {
      if (c.tokens[o] === null) return;
      if (!mine(o) && !S.peerInit.has(o)) await initPeer(o).catch(() => {});
      try {
        const r = await listIn(o, `'${qv(o)}' in parents and name='${qv(c.id)}' and trashed=false`, { orderBy: 'createdTime desc', pageSize: PAGE, pageToken: c.tokens[o] || undefined });
        for (const f of r.files || []) await processFile(f, o, false);
        c.tokens[o] = r.nextPageToken || null;
      } catch (e) { console.warn('history', o, e.message); c.tokens[o] = null; }
    }));
    c.hasMore = members.some(o => c.tokens[o]);
    c.loaded = true;
  } finally { c.loading = false; scheduleRender(); }
}

/* ============================ CONTACTS / INVITES ============================ */
function appBase() { const u = new URL(location.href); u.search = ''; u.hash = ''; return u.toString(); }
function linkFor(reply) { return `${appBase()}#add=${S.outbox}${reply ? '.' + reply : ''}`; }
async function freshInviteLink() {

    r ||= b64(crypto.getRandomValues(new Uint8Array(18))).replace(/\+/g, '-').replace(/\//g, '_');
    S.st.myR = r; S.st.pending = [...(S.st.pending || []), { r, t: Date.now(), keep: true }]; saveState(true);
  }

async function acceptLink(link) {

      <label class="lbl">Friend's email</label>
      <div class="row-inline"><input class="field" id="inv-email" type="email" inputmode="email" autocomplete="email" placeholder="friend@gmail.com"><button class="btn" id="inv-send">Send</button></div>
      <p class="tiny muted" id="mail-hint">Opens your email with a ready-to-send invite.</p>
    </div>
    <div class="divider">HAVE A FRIEND'S LINK?</div>
    <div class="row-inline"><input class="field" id="paste-link" placeholder="Paste it here"><button class="btn ghost" id="paste-go">Add</button></div>`);
  relayInfo().then(i => { const h = $('#mail-hint'); if (h && i?.email) h.textContent = 'We\'ll email them a personal invite with your photo and an Accept button.'; });
  const link = await freshInviteLink();
  if (!$('#my-link', o)) return;
  $('#my-link', o).value = link; $('#my-link-t', o).textContent = link.replace(/^https?:\/\//, '');
  const t = inviteText(link), cp = $('#cp-link', o); cp.disabled = false;
  cp.onclick = () => navigator.clipboard?.writeText(link).then(() => { cp.textContent = 'Copied ✓'; setTimeout(() => { if (cp.isConnected) cp.textContent = 'Copy'; }, 1800); });
  const open = url => window.open(url, '_blank', 'noopener');
  $('.stiles', o).onclick = e => {
    const k = e.target.closest('.stile')?.dataset.k; if (!k) return;
    if (k === 'share') navigator.share({ title: t.subject, text: t.short, url: link }).catch(() => {});
    else if (k === 'wa') open('https://wa.me/?text=' + encodeURIComponent(t.short + ' ' + link));
    else if (k === 'tg') open('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(t.short));
    else if (k === 'vb') location.href = 'viber://forward?text=' + encodeURIComponent(t.short + ' ' + link);
    else if (k === 'mail') { $('#mail-row', o).classList.remove('hidden'); $('#inv-email', o).focus(); }
  };
  const send = async () => {
    const em = $('#inv-email', o).value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('Enter a valid email address', true);
    const btn = $('#inv-send', o); btn.disabled = true; btn.textContent = 'Sending…';
    try { const how = await emailInvite(em, link); if (how === 'sent') { toast(`Invite sent to ${em} ✉️`); closeModal(); } else { btn.disabled = false; btn.textContent = 'Send'; } }
    catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Send'; }
  };
  $('#inv-send', o).onclick = send; $('#inv-email', o).onkeydown = e => { if (e.key === 'Enter') send(); };
  $('#paste-go', o).onclick = () => { const v = $('#paste-link', o).value; closeModal(); acceptLink(v); };
}
function pickPeopleModal(title, exclude, onDone, { group = false } = {}) {
  const people = Object.keys(S.st.contacts).filter(o => !exclude.includes(o)).map(personOf).sort((a, b) => a.n.localeCompare(b.n));
  const sel = new Set();
  const o = modal(title, `
    ${group ? `<label class="lbl">Group name</label><input class="field" id="g-name" maxlength="80" placeholder="e.g. Weekend trip">` : ''}
    <input class="field" id="p-q" placeholder="Search contacts" style="margin:12px 0 4px"><div class="chips" id="chips"></div><div id="p-list"></div>
    ${people.length ? '' : `<div class="empty">No contacts to add yet.<br><br><button class="btn" id="p-inv">Add people</button></div>`}`,
    `<button class="btn ghost" id="p-cancel">Cancel</button><button class="btn" id="p-ok" disabled>${group ? 'Create' : 'Add'}</button>`);
  const draw = () => {
    const q = $('#p-q', o).value.toLowerCase();
    $('#p-list', o).innerHTML = people.filter(u => !q || u.n.toLowerCase().includes(q) || u.e.toLowerCase().includes(q)).map(u => `<button class="pick${sel.has(u.o) ? ' sel' : ''}" data-o="${esc(u.o)}">${avatarHtml(u, 40, isOnline(u))}<div style="min-width:0"><b>${esc(u.n)}</b><div class="tiny muted">${esc(u.e)}</div></div><span class="chk">${sel.has(u.o) ? I.check : ''}</span></button>`).join('');
    $('#chips', o).innerHTML = [...sel].map(x => `<span class="chip">${esc(personOf(x).n)}</span>`).join('');
    $('#p-ok', o).disabled = !sel.size;
  };
  draw();
  $('#p-q', o).oninput = draw;
  $('#p-list', o).onclick = e => { const b = e.target.closest('.pick'); if (!b) return; sel.has(b.dataset.o) ? sel.delete(b.dataset.o) : sel.add(b.dataset.o); draw(); };
  $('#p-cancel', o).onclick = closeModal;
  $('#p-ok', o).onclick = () => onDone([...sel], group ? $('#g-name', o).value.trim() : '');
  const inv = $('#p-inv', o); if (inv) inv.onclick = () => addPeopleModal();
}
function newChatModal() {
  const people = Object.keys(S.st.contacts).map(personOf).sort((a, b) => (isOnline(b) - isOnline(a)) || a.n.localeCompare(b.n));
  const o = modal('New conversation', `
    <button class="pick" id="nc-group"><div class="av" style="width:40px;height:40px"><div class="ini" style="background:var(--accent-soft);color:var(--accent)">${I.users}</div></div><b>New group</b></button>
    <button class="pick" id="nc-inv"><div class="av" style="width:40px;height:40px"><div class="ini" style="background:var(--accent-soft);color:var(--accent)">${I.userplus}</div></div><b>Add people</b></button>
    <div class="divider">CONTACTS</div>
    ${people.map(u => `<button class="pick" data-o="${esc(u.o)}">${avatarHtml(u, 40, isOnline(u))}<div style="min-width:0"><b>${esc(u.n)}</b><div class="tiny muted">${esc(u.st || u.e)}</div></div></button>`).join('') || '<div class="empty" style="padding:10px">No contacts yet — add people first.</div>'}`);
  $('#nc-group', o).onclick = () => pickPeopleModal('New group', [], (sel, name) => createGroup(name, sel), { group: true });
  $('#nc-inv', o).onclick = () => addPeopleModal();
  $$('.pick[data-o]', o).forEach(b => b.onclick = () => { closeModal(); const c = [...S.convos.values()].find(x => x.kind === 'dm' && x.peer === b.dataset.o); if (c) openConvo(c.id); });
}
function renameModal(c) {
  const o = modal('Rename group', `<input class="field" id="rn" maxlength="80" value="${esc(c.name)}">`, `<button class="btn ghost" id="rn-c">Cancel</button><button class="btn" id="rn-ok">Save</button>`);
  const inp = $('#rn', o); inp.focus(); inp.select();

  $('#rn-ok', o).onclick = async () => { const n = inp.value.trim(); closeModal(); if (n !== c.name) try { await renameGroup(c, n); } catch (e) { toast(e.message, true); } };
}
function settingsModal() {
  const o = modal('Settings', `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">${avatarHtml({ n: S.prof.n, c: S.prof.c, p: S.me.photo }, 60)}<div style="min-width:0"><b>${esc(S.prof.n)}</b><div class="small muted" style="overflow:hidden;text-overflow:ellipsis">${esc(S.me.email)}</div></div></div>
    <label class="lbl">Display name</label><input class="field" id="s-name" maxlength="60" value="${esc(S.prof.n)}">
    <label class="lbl">Status</label><input class="field" id="s-st" maxlength="120" placeholder="What's on your mind?" value="${esc(S.prof.st)}">
    <label class="lbl">Color</label><div class="swatches" id="s-col">${COLORS.map(c => `<button class="sw${c === S.prof.c ? ' on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
    <label class="lbl">Theme</label><div class="seg" id="s-theme">${['system', 'light', 'dark'].map(t => `<button data-t="${t}" class="${S.theme === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
    <label class="lbl">Notifications</label>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="s-notif" ${S.notify ? 'checked' : ''}> Show notifications</label>
    <div class="small muted" style="margin:2px 0 8px">${'Notification' in window && Notification.permission === 'granted' ? (S.myPush ? '🔔 On, including when DriveChat is closed.' : pushReady() ? '🔔 On while DriveChat is open.' : '🔔 On while DriveChat is open.') : `<button class="btn ghost" id="s-enable" style="padding:6px 12px">${iconSm('bell', 15)} Turn on notifications</button>`}</div>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="s-sound" ${S.sound ? 'checked' : ''}> Sounds</label>
    <div class="divider">PRIVACY</div>

    <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn ghost hidden" data-install id="s-install">${I.install} Install app</button><button class="btn ghost" id="s-inv">${I.userplus} Add people</button><a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://drive.google.com/drive/folders/${esc(S.root)}">Open in Drive</a></div>
    <div class="divider">ACCOUNT</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn ghost" id="s-lock">${I.lock} Forget keys on this device</button><button class="btn ghost" id="s-out">${I.out} Sign out</button></div>`,
    `<button class="btn ghost" id="s-c">Cancel</button><button class="btn" id="s-save">Save</button>`);
  let color = S.prof.c, theme = S.theme;
  $('#s-col', o).onclick = e => { const b = e.target.closest('.sw'); if (!b) return; color = b.dataset.c; $$('.sw', o).forEach(x => x.classList.toggle('on', x === b)); };
  $('#s-theme', o).onclick = e => { const b = e.target.closest('button'); if (!b) return; theme = b.dataset.t; $$('#s-theme button', o).forEach(x => x.classList.toggle('on', x === b)); S.theme = theme; applyTheme(); };
  $('#s-c', o).onclick = () => { S.theme = LS.get('theme', 'system'); applyTheme(); closeModal(); };
  $('#s-inv', o).onclick = () => addPeopleModal();
  $('#s-install', o).onclick = () => installApp(); refreshInstallUI();
  const se = $('#s-enable', o); if (se) se.onclick = () => { closeModal(); enableNotifications(); };
  $('#s-out', o).onclick = () => { closeModal(); signOut(); };
  $('#s-lock', o).onclick = async () => { if (!confirm('Remove your decryption key from this browser? You\'ll need your backup password next time.')) return; await IDB.del('id:' + S.me.email); closeModal(); signOut(); };
  $('#s-save', o).onclick = async () => {
    S.prof.n = $('#s-name', o).value.trim() || S.me.name; S.prof.st = $('#s-st', o).value.trim(); S.prof.c = color;
    S.st.me = { ...S.prof }; saveState();
    S.theme = theme; LS.set('theme', theme); applyTheme();
    S.notify = $('#s-notif', o).checked; LS.set('notify', S.notify); S.sound = $('#s-sound', o).checked; LS.set('sound', S.sound);
    if (S.notify && 'Notification' in window && Notification.permission === 'default') enableNotifications();
    closeModal(); renderMain(); toast('Saved');
    try { await publishProfile(); } catch (e) { toast(e.message, true); }
  };
}

/* ============================ INSTALL (PWA) ============================ */
let installPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canInstall = () => !isStandalone() && (!!installPrompt || isIOS() || matchMedia('(pointer:coarse)').matches);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; refreshInstallUI(); });
addEventListener('appinstalled', () => { installPrompt = null; refreshInstallUI(); toast('DriveChat installed 🎉'); });
function refreshInstallUI() { $$('[data-install]').forEach(el => el.classList.toggle('hidden', !canInstall())); }
async function installApp(forNotifications = false) {
  if (installPrompt) { installPrompt.prompt(); try { await installPrompt.userChoice; } catch {} installPrompt = null; refreshInstallUI(); return; }
  const step = (n, html) => `<div class="istep"><span class="inum">${n}</span><div>${html}</div></div>`;
  let body;
  if (isIOS()) {
    const safari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    body = (forNotifications ? `<div class="note">${iconSm('bell', 18)}<span>On iPhone, notifications only work after DriveChat is added to your Home Screen. Add it, open it from the Home Screen, then tap <b>Turn on notifications</b>.</span></div>` : '') + (safari ? '' : `<div class="note warn">On iPhone and iPad, apps can only be installed from <b>Safari</b>. Open this page in Safari first.</div>`)
      + step(1, `Tap the <b>Share</b> button <span class="kbd">${iconSm('iosShare', 16)}</span> at the bottom of Safari (top on iPad).`)
      + step(2, `Scroll down and tap <b>Add to Home Screen</b> <span class="kbd">${iconSm('plus', 16)}</span>.`)
      + step(3, `Tap <b>Add</b>. DriveChat now appears on your Home Screen like any other app.`);
  } else if (/android/i.test(navigator.userAgent)) {
    body = step(1, `Tap the browser menu <span class="kbd">⋮</span> (top right in Chrome).`)
      + step(2, `Tap <b>Install app</b> or <b>Add to Home screen</b>.`)
      + step(3, `Tap <b>Install</b>. DriveChat appears in your app drawer with its own icon.`);
  } else {
    body = step(1, `In <b>Chrome</b> or <b>Edge</b>, click the install icon <span class="kbd">${iconSm('install', 16)}</span> at the right end of the address bar.`)
      + step(2, `Or open the browser menu <span class="kbd">⋮</span> → <b>Cast, save and share</b> → <b>Install page as app</b> (Chrome), or <b>Apps</b> → <b>Install this site as an app</b> (Edge).`)
      + step(3, `DriveChat opens in its own window and gets a Start menu / Dock icon.`)
      + `<p class="tiny muted">Safari on Mac: File → Add to Dock. Firefox doesn't support installing web apps.</p>`;
  }
  modal('Install DriveChat', `<div style="display:flex;justify-content:center;margin:4px 0 16px"><img src="icon-192.png" width="72" height="72" alt="" style="border-radius:18px;box-shadow:0 8px 24px rgba(115,96,242,.35)"></div>${body}`, `<button class="btn" id="inst-ok">Got it</button>`);
  $('#inst-ok').onclick = closeModal;
}

/* ============================ MOBILE: back button + keyboard-aware height ============================ */
const isNarrow = () => innerWidth <= 760;
let skipPop = false;
function popBack() { skipPop = true; history.back(); }
addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; return; }
  if ($('#overlay')) { closeModal(true); return; }
  if (S.showInfo && isNarrow()) { S.showInfo = false; renderMain(); return; }
  if (S.active && isNarrow()) { S.active = null; S.showInfo = false; renderMain(); }
});
function fitViewport() {
  const h = window.visualViewport ? visualViewport.height : innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (window.visualViewport && document.activeElement?.tagName === 'TEXTAREA') window.scrollTo(0, 0);
}
window.visualViewport?.addEventListener('resize', fitViewport); addEventListener('resize', fitViewport); fitViewport();

/* ============================ BOOT ============================ */
document.addEventListener('visibilitychange', () => { if (!S.running) return; if (!document.hidden) { S.nextPoll.clear(); markRead(); saveStatus(); pendingLoop.wake?.(); } else saveStatus(true); });
addEventListener('focus', () => S.running && markRead());
addEventListener('online', () => S.running && S.nextPoll.clear());
addEventListener('hashchange', () => { const L = parseLink(location.hash); if (L && S.running) { history.replaceState(null, '', location.pathname + location.search); acceptLink(L.o + (L.r ? '.' + L.r : '')); } });
addEventListener('beforeunload', e => { if (call) { e.preventDefault(); e.returnValue = ''; } });

async function boot() {
  applyTheme();
  if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    navigator.serviceWorker?.register('sw.js').catch(e => console.warn('sw', e));
    navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.type === 'poll' && S.running) { S.nextPoll.clear(); pollLoop.wake?.(); } if (e.data?.type === 'open' && S.convos.has(e.data.cid)) { window.focus(); openConvo(e.data.cid); } });
  }
  const om = location.hash.match(/open=([\w-]+)/); if (om) { LS.set('lastConvo', om[1]); history.replaceState(null, '', location.pathname + location.search); }
  const L = parseLink(location.hash);
  if (L) { LS.set('pendingAdd', L.o + (L.r ? '.' + L.r : '')); history.replaceState(null, '', location.pathname + location.search); }
  if (location.protocol === 'file:') { root().innerHTML = `<div class="screen"><div class="card"><h1>Serve over http(s)</h1><p class="muted">Google sign-in doesn't work from <code>file://</code>. Run <code>python3 -m http.server 8080</code> here and open <code>http://localhost:8080</code>, or deploy to GitHub Pages / Netlify.</p></div></div>`; return; }
  if (!cfg().clientId || !cfg().apiKey) return showSetup();
  showLoading('Loading…');
  try { await initAuth(); } catch (e) { return showSignIn(e.message); }
  if (accessToken && LS.get('lastEmail')) { try { await afterSignIn(); return; } catch (e) { console.warn(e); } }
  showSignIn();
}
boot();
